name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Run full test suite (fixture DuckDB + fake embedder, no model downloads)
        run: uv run --frozen pytest -v
