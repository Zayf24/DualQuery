name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pydantic sqlglot rich pandas pyarrow rapidfuzz pytest pytest-asyncio
      - name: Run 5-gate AST security & BYOE header tests
        run: |
          PYTHONPATH=src:. pytest tests/test_security_compiler.py tests/test_byoe_audit.py -k "not test_byoe_ingest_and_audit_pipeline" -v
